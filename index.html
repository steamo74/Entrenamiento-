<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0878c9"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Mi entrenamiento semanal</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7fbff;color:#102a56}header{background:linear-gradient(135deg,#0878c9,#075da5);color:white;padding:24px 16px 20px;text-align:center;border-radius:0 0 24px 24px}h1{font-size:23px;margin:0 0 5px}.subtitle{font-size:13px}.container{max-width:620px;margin:auto;padding:15px}.week{display:flex;align-items:center;gap:7px;background:white;border:1px solid #b8dcf5;border-radius:16px;padding:9px;margin-bottom:12px}.week button{border:0;border-radius:10px;background:#eef6fb;color:#315c78;font-weight:800;padding:9px 12px;font-size:18px}.weekmid{text-align:center;flex:1}.weektitle{font-weight:800;font-size:16px}.dates{font-size:12px;color:#698399}.today{background:none!important;color:#0878c9!important;font-size:11px!important;padding:2px!important}.progress,.history{background:white;border:1px solid #b8dcf5;border-radius:18px;padding:14px;margin-bottom:12px}.top{display:flex;justify-content:space-between;font-weight:800}.bar{height:9px;background:#e4eef5;border-radius:8px;margin-top:9px}.fill{height:100%;background:#159447;border-radius:8px}.legend{font-size:11px;color:#71879a;margin-top:7px}.day{background:white;border:1px solid #b8dcf5;border-radius:17px;margin:10px 0;overflow:hidden}.dayhead{display:flex;align-items:center;padding:14px;cursor:pointer}.daytitle{flex:1}.weekday{font-weight:800}.doneinfo{font-size:11px;color:#698399;margin-top:3px}.arrow{font-size:21px;color:#7290a6}.body{display:none;border-top:1px solid #e3eef5;padding:10px 13px}.open .body{display:block}.cat{margin-bottom:13px}.cat:last-child{margin:0}.catname{font-size:14px;font-weight:800;margin-bottom:7px}.row{display:flex;gap:7px;margin:6px 0}.check{flex:1;min-height:42px;border:1px solid #b9cfdf;background:white;color:#34556d;border-radius:11px;padding:9px 10px;text-align:left;font-weight:800}.check.done{background:#159447;border-color:#159447;color:white}.fuerza .check.done{background:#0878c9;border-color:#0878c9}.core .check.done{background:#7555b8;border-color:#7555b8}.photo{width:47px;border:1px solid #b9cfdf;background:white;border-radius:11px;font-size:18px}.photo.has{background:#fff7df;border-color:#e4c76b}.file{display:none}.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid #d7e5ee;cursor:pointer}.historyrow{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:6px;padding:9px 0;border-bottom:1px solid #e8f0f5;font-size:12px}.historyrow:last-child{border:0}.num{text-align:center;font-weight:800}.head{font-weight:800;font-size:10px;color:#698399}.settings{margin-bottom:12px}.setbtn{width:100%;border:0;background:#eef6fb;color:#315c78;padding:10px 13px;border-radius:12px;font-weight:800;text-align:left}.panel{display:none;background:white;border:1px solid #b8dcf5;border-radius:14px;margin-top:7px;padding:12px}.panel.open{display:block}.grid{display:grid;grid-template-columns:1fr 90px;gap:7px;margin:7px 0}.grid input,.targets input{width:100%;border:1px solid #b9cfdf;border-radius:9px;padding:8px}.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.targets label{font-size:11px;color:#698399;font-weight:800}.save,.reset{border:0;background:#0878c9;color:white;padding:9px 13px;border-radius:10px;font-weight:800}.reset{background:#eef6fb;color:#35617c}footer{text-align:center;color:#71879a;font-size:12px;padding:18px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:1000;align-items:center;justify-content:center;padding:18px}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:86vh;object-fit:contain;border-radius:8px}.closebox{position:absolute;top:14px;right:14px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:white;font-size:27px}.navbox{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:52px;border:0;border-radius:12px;background:rgba(255,255,255,.18);color:white;font-size:28px}.prevbox{left:10px}.nextbox{right:10px}.photoinfo{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:white;font-size:12px}
</style></head><body><header><h1>PLAN SEMANAL · ENTRENAMIENTO</h1><div class="subtitle" id="objective"></div></header><main class="container">
<section class="week"><button id="prev">‹</button><div class="weekmid"><div class="weektitle" id="wt"></div><div class="dates" id="wd"></div><button class="today" id="today">IR A ESTA SEMANA</button></div><button id="next">›</button></section>
<section class="progress"><div class="top"><span>Progreso</span><span id="pc"></span></div><div class="bar"><div class="fill" id="pf"></div></div><div class="legend" id="sum"></div></section>
<section class="settings"><button class="setbtn" id="st">⚙️ Objetivos y frecuencia semanal</button><div class="panel" id="panel"><b>Objetivos de peso</b><div class="grid"><input id="g1l"><input id="g1k" type="number" step=".1"></div><div class="grid"><input id="g2l"><input id="g2k" type="number" step=".1"></div><b>Sesiones semanales</b><div class="targets"><div><label>Cardio</label><input id="tc" type="number" min="0" max="7"></div><div><label>Fuerza</label><input id="tf" type="number" min="0" max="7"></div><div><label>Core</label><input id="tco" type="number" min="0" max="7"></div></div><br><button class="save" id="saveg">Guardar</button></div></section>
<div id="days"></div><section class="history"><div class="top"><span>Historial semanal</span><span>Cardio · Fuerza · Core</span></div><div id="hist"></div></section><footer><button class="reset" id="reset">Reiniciar semana</button><br><br>Los checks y las fotos se guardan en este iPhone.</footer></main>
<div class="lightbox" id="lightbox"><button class="closebox" id="closebox">×</button><button class="navbox prevbox" id="prevbox">‹</button><img id="bigphoto"><button class="navbox nextbox" id="nextbox">›</button><div class="photoinfo" id="photoinfo"></div></div>
<script>
const GO="entrenamiento-goals",WK="entrenamiento-weeks",VW="entrenamiento-view-week",CO=["Elíptica","Cinta","Correr"],FU=["Pecho","Hombros","Tríceps","Piernas","Espalda","Bíceps"],CR=["Core"],D=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"],DEF={g1l:"diciembre",g1k:74,g2l:"marzo",g2k:72.5,tc:3,tf:4,tco:2};
function readJSON(k,f){try{return JSON.parse(localStorage.getItem(k)||"null")??f}catch(e){return f}}\nlet goals=readJSON(GO,DEF),weeks=readJSON(WK,{});
const monday=x=>{x=new Date(x);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x},id=x=>monday(x).toISOString().slice(0,10),current=id(new Date());
let view=localStorage.getItem(VW)||current;
const blank=()=>({cardio:{},fuerza:{},core:{}});
function state(){if(!Array.isArray(weeks[view]))weeks[view]=Array.from({length:7},blank);return weeks[view]}let s=state();const $=id=>document.getElementById(id);
const el={pc:$("pc"),pf:$("pf"),sum:$("sum"),wt:$("wt"),wd:$("wd"),today:$("today"),hist:$("hist"),objective:$("objective"),g1l:$("g1l"),g1k:$("g1k"),g2l:$("g2l"),g2k:$("g2k"),tc:$("tc"),tf:$("tf"),tco:$("tco"),st:$("st"),panel:$("panel"),saveg:$("saveg"),reset:$("reset"),prev:$("prev"),next:$("next"),lightbox:$("lightbox"),bigphoto:$("bigphoto"),photoinfo:$("photoinfo"),prevbox:$("prevbox"),nextbox:$("nextbox"),closebox:$("closebox")};

function save(){weeks[view]=s;localStorage.setItem(WK,JSON.stringify(weeks));renderHistory()}
function has(i,t){return Object.values(s[i][t]||{}).some(Boolean)}
function count(t){return s.filter((x,i)=>has(i,t)).length}
function toggle(i,t,k){s[i][t][k]=!s[i][t][k];save();render()}
const db=new Promise((ok,no)=>{try{let r=indexedDB.open("entrenamiento-fotos",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}).catch(()=>null);
async function photos(i,t,k){let d=await db;if(!d)return [];return new Promise((ok,no)=>{let q=d.transaction("photos").objectStore("photos").getAll();q.onsuccess=()=>ok(q.result.filter(x=>x.key===view+"|"+i+"|"+t+"|"+k));q.onerror=()=>no(q.error)})}
async function add(i,t,k,f){let d=await db;if(!d)return;let b=await f.arrayBuffer();return new Promise((ok,no)=>{let q=d.transaction("photos","readwrite").objectStore("photos").add({key:view+"|"+i+"|"+t+"|"+k,type:f.type,data:b});q.onsuccess=ok;q.onerror=no})}
let viewer={items:[],index:0};
function showViewer(items,index){viewer={items,index};el.lightbox.classList.add("open");showPhoto()}
function showPhoto(){let p=viewer.items[viewer.index];el.bigphoto.src=URL.createObjectURL(new Blob([p.data],{type:p.type}));el.photoinfo.textContent=(viewer.index+1)+" / "+viewer.items.length}
function closeViewer(){el.lightbox.classList.remove("open");el.bigphoto.removeAttribute("src")}
el.prevbox.onclick=()=>{if(viewer.items.length){viewer.index=(viewer.index-1+viewer.items.length)%viewer.items.length;showPhoto()}}
el.nextbox.onclick=()=>{if(viewer.items.length){viewer.index=(viewer.index+1)%viewer.items.length;showPhoto()}}
el.closebox.onclick=closeViewer;el.lightbox.onclick=e=>{if(e.target===el.lightbox)closeViewer()};document.addEventListener("keydown",e=>{if(!el.lightbox.classList.contains("open"))return;if(e.key==="Escape")closeViewer();if(e.key==="ArrowLeft")el.prevbox.click();if(e.key==="ArrowRight")el.nextbox.click()});
function row(i,t,k){return '<div class="row"><button class="check '+(s[i][t][k]?"done":"")+'">'+(s[i][t][k]?"✓ ":"")+k+'</button><button class="photo">📷</button><input class="file" type="file" accept="image/*" capture="environment"></div><div class="thumbs"></div>'}
async function loadPhotos(){let days=document.querySelectorAll(".day");for(let i=0;i<7;i++)for(let [t,a] of [["cardio",CO],["fuerza",FU],["core",CR]])for(let k of a){let l=days[i]?.querySelector("."+t+" .list");if(!l)continue;let r=[...l.querySelectorAll(".row")].find(x=>x.querySelector(".check")?.textContent.replace("✓ ","")===k);if(!r)continue;let ps=await photos(i,t,k),pb=r.querySelector(".photo"),th=r.nextElementSibling;if(ps.length)pb.textContent="📷 "+ps.length;th.innerHTML=ps.map((p,n)=>'<img class="thumb" data-photo="'+n+'" src="'+URL.createObjectURL(new Blob([p.data],{type:p.type}))+'" alt="Foto '+(n+1)+'">').join("");th.querySelectorAll(".thumb").forEach(x=>x.onclick=()=>showViewer(ps,+x.dataset.photo))}}}
function render(){let b=document.getElementById("days");b.innerHTML="";for(let i=0;i<7;i++){let c=document.createElement("section");c.className="day";let info=(has(i,"cardio")?"Cardio ✓ ":"")+(has(i,"fuerza")?"Fuerza ✓ ":"")+(has(i,"core")?"Core ✓":"")||"Sin registrar";c.innerHTML='<div class="dayhead"><div class="daytitle"><div class="weekday">'+D[i]+'</div><div class="doneinfo">'+info+'</div></div><div class="arrow">›</div></div><div class="body"><div class="cat cardio"><div class="catname">1 · Cardio</div><div class="list"></div></div><div class="cat fuerza"><div class="catname">2 · Fuerza</div><div class="list"></div></div><div class="cat core"><div class="catname">3 · Core</div><div class="list"></div></div></div>';c.querySelector(".dayhead").onclick=()=>c.classList.toggle("open");b.appendChild(c);for(let [t,a] of [["cardio",CO],["fuerza",FU],["core",CR]])for(let k of a){let l=c.querySelector("."+t+" .list");l.insertAdjacentHTML("beforeend",row(i,t,k));let r=l.lastElementChild,cb=r.querySelector(".check"),pb=r.querySelector(".photo"),fi=r.querySelector(".file");cb.onclick=e=>{e.stopPropagation();toggle(i,t,k)};pb.onclick=e=>{e.stopPropagation();fi.click()};fi.onchange=async e=>{if(e.target.files[0]){await add(i,t,k,e.target.files[0]);render()}}}}update();loadPhotos()}
function update(){let c=count("cardio"),f=count("fuerza"),n=c+f,t=goals.tc+goals.tf;el.pc.textContent=n+" / "+t;el.pf.style.width=(t?Math.min(100,n/t*100):0)+"%";el.sum.textContent="Cardio "+c+"/"+goals.tc+" · Fuerza "+f+"/"+goals.tf+" · Core "+count("core")+"/"+goals.tco}
function fmt(x){return x.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"})}
function weekNo(x){let d=new Date(x+"T12:00:00");d.setDate(d.getDate()+3-(d.getDay()+6)%7);let y=d.getFullYear(),first=new Date(y,0,4);return 1+Math.round(((d-first)/86400000-3+(first.getDay()+6)%7)/7)}
function nav(){let d=new Date(view+"T12:00:00"),e=new Date(d);e.setDate(d.getDate()+6);el.wt.textContent=(view==current?"Semana actual · ":"Semana ")+weekNo(view);el.wd.textContent=fmt(d)+" – "+fmt(e);el.today.style.visibility=view==current?"hidden":"visible"}
function move(n){let d=new Date(view+"T12:00:00");d.setDate(d.getDate()+n*7);view=id(d);localStorage.setItem(VW,view);s=state();nav();render()}
el.prev.onclick=()=>move(-1);el.next.onclick=()=>move(1);el.today.onclick=()=>{view=current;localStorage.setItem(VW,view);s=state();nav();render()};
function renderHistory(){let ids=Object.keys(weeks).sort().reverse().slice(0,12);el.hist.innerHTML=ids.length?'<div class="historyrow head"><div>Semana</div><div class="num">Cardio</div><div class="num">Fuerza</div><div class="num">Core</div></div>'+ids.map(x=>{let w=weeks[x],cc=Array.isArray(w)?{c:w.filter(d=>Object.values(d.cardio||{}).some(Boolean)).length,f:w.filter(d=>Object.values(d.fuerza||{}).some(Boolean)).length,co:w.filter(d=>Object.values(d.core||{}).some(Boolean)).length}:{c:Object.values(w.cardio||{}).filter(Boolean).length,f:Object.values(w.fuerza||{}).filter(Boolean).length,co:Object.values(w.core||{}).filter(Boolean).length},d=new Date(x+"T12:00:00"),e=new Date(d);e.setDate(d.getDate()+6);return '<div class="historyrow"><div>'+fmt(d)+" – "+fmt(e)+'</div><div class="num">'+cc.c+'</div><div class="num">'+cc.f+'</div><div class="num">'+cc.co+'</div></div>}).join(""):'<div class="legend">Todavía no hay semanas registradas.</div>'}
function goalsUI(){el.g1l.value=goals.g1l;el.g1k.value=goals.g1k;el.g2l.value=goals.g2l;el.g2k.value=goals.g2k;el.tc.value=goals.tc;el.tf.value=goals.tf;el.tco.value=goals.tco;el.objective.textContent="Objetivo: "+goals.g1l+" "+goals.g1k.toFixed(1).replace(".",",")+" kg · "+goals.g2l+" "+goals.g2k.toFixed(1).replace(".",",")+" kg"}
el.st.onclick=()=>el.panel.classList.toggle("open");el.saveg.onclick=()=>{goals={g1l:el.g1l.value,g1k:+el.g1k.value||0,g2l:el.g2l.value,g2k:+el.g2k.value||0,tc:+el.tc.value||0,tf:+el.tf.value||0,tco:+el.tco.value||0};localStorage.setItem(GO,JSON.stringify(goals));goalsUI();el.panel.classList.remove("open");render()};
el.reset.onclick=()=>{if(confirm("¿Reiniciar todos los checks de esta semana?")){s=Array.from({length:7},blank);save();render()}};
goalsUI();nav();render();renderHistory();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=5").catch(()=>{}));
</script></body></html>
